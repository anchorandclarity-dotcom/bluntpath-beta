<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>React &amp; Refine — Bluntpath</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="shell" id="app"></div>

<script>
let draft = null;
let verdicts = {};

function loadDraft() {
  const raw = sessionStorage.getItem('ac_current_report');
  if (!raw) return null;
  try {
    const parsed = JSON.parse(raw);
    if (!parsed.section_3_directions) return null;
    return parsed;
  } catch (e) {
    return null;
  }
}

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMissing() {
  document.getElementById('app').innerHTML = `
    <span class="tab mono">CASE FILE \u00b7 REACT &amp; REFINE</span>
    <div class="folder">
      <h1>We can't find your draft directions</h1>
      <p>This page needs the result of your Discovery step. Please start again from the beginning.</p>
      <a class="btn btn-primary" href="/discover.html">Back to Discovery</a>
    </div>
  `;
}

function renderForm() {
  const directionCards = draft.section_3_directions.map((d, i) => `
    <div class="exhibit" data-direction="${i}">
      <h3 style="margin:0 0 6px;">${escapeHtml(d.name)}</h3>
      <p style="font-size:14px;color:var(--ink-soft);margin:0 0 10px;">${escapeHtml(d.what_it_is)}</p>
      <div class="chip-row">
        <button type="button" class="chip" data-verdict="yes" data-i="${i}">YES</button>
        <button type="button" class="chip" data-verdict="maybe" data-i="${i}">MAYBE</button>
        <button type="button" class="chip" data-verdict="no" data-i="${i}">NO</button>
      </div>
      <div class="field" style="margin-top:12px;">
        <label>Why?</label>
        <textarea data-i="${i}" data-field="reason" placeholder="In your own words \u2014 why that reaction?"></textarea>
      </div>
      <div class="field">
        <label>Anything that would make this hard in practice?</label>
        <textarea data-i="${i}" data-field="difficulty" placeholder="Optional \u2014 leave blank if nothing comes to mind."></textarea>
      </div>
    </div>
  `).join('');

  document.getElementById('app').innerHTML = `
    <span class="tab mono">CASE FILE \u00b7 REACT &amp; REFINE</span>
    <div class="folder">
      <h1>React to your directions</h1>
      <div class="sub">Be honest \u2014 a real NO is more useful than a polite MAYBE.</div>
      <p>${escapeHtml(draft.draft_recommendation || '')}</p>
    </div>

    <div style="height:20px;"></div>
    ${directionCards}

    <div class="folder" style="margin-top:20px;">
      <div class="field">
        <label>Anything else we should know?</label>
        <textarea id="extra-notes" placeholder="Optional. Anything that would change your answer?"></textarea>
      </div>
      <div id="error-msg" style="display:none;color:#E8B7A4;font-size:13.5px;margin-bottom:14px;"></div>
      <button class="btn btn-primary" id="submit-btn">Get my final opportunity</button>
    </div>
  `;

  document.querySelectorAll('.chip[data-verdict]').forEach(chip => {
    chip.onclick = () => {
      const i = chip.dataset.i;
      const verdict = chip.dataset.verdict;
      verdicts[i] = verdict;
      document.querySelectorAll(`.chip[data-i="${i}"]`).forEach(c => {
        c.classList.remove('selected-yes','selected-maybe','selected-no');
      });
      chip.classList.add('selected-' + verdict);
    };
  });

  document.getElementById('submit-btn').onclick = handleSubmit;
}

function renderLoading() {
  document.getElementById('app').innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div class="mono">REFINING YOUR REPORT\u2026</div>
    </div>
  `;
}

async function handleSubmit() {
  const errorEl = document.getElementById('error-msg');
  const directions = draft.section_3_directions;

  const reactions = [];
  let missingVerdict = false;

  directions.forEach((d, i) => {
    const verdict = verdicts[i];
    if (!verdict) missingVerdict = true;
    const reasonEl = document.querySelector(`textarea[data-i="${i}"][data-field="reason"]`);
    const difficultyEl = document.querySelector(`textarea[data-i="${i}"][data-field="difficulty"]`);
    reactions.push({
      direction: d.name,
      verdict: verdict || '',
      reason: reasonEl ? reasonEl.value.trim() : '',
      difficulty: difficultyEl ? difficultyEl.value.trim() : ''
    });
  });

  if (missingVerdict) {
    errorEl.textContent = 'Please give a YES, MAYBE, or NO for every direction.';
    errorEl.style.display = 'block';
    return;
  }

  const notes = document.getElementById('extra-notes').value.trim();

  renderLoading();

  try {
    const response = await fetch('/.netlify/functions/refine-report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        reference: draft.reference,
        customer_name: draft.customer_name,
        customer_email: draft.customer_email,
        original_directions: directions,
        reactions: reactions,
        constraints: {
          // carried forward from Discovery, plus any new notes from refine
          ticked_from_discovery: draft.constraints || [],
          quick_facts: draft.quick_facts || {},
          notes
        }
      })
    });

    const data = await response.json();

    if (!response.ok || data.status === 'error') {
      sessionStorage.setItem('ac_report_error', data.message || 'Something went wrong refining your report.');
      window.location.href = '/report.html';
      return;
    }

    sessionStorage.setItem('ac_current_report', JSON.stringify(data));
    window.location.href = '/report.html';
  } catch (err) {
    sessionStorage.setItem('ac_report_error', 'Could not reach the server. Please try again.');
    window.location.href = '/report.html';
  }
}

draft = loadDraft();
if (!draft) {
  renderMissing();
} else {
  renderForm();
}
</script>
</body>
</html>
